<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>PROFIS</title>
    <script>
      // Fallback для хостингов вроде GitHub Pages: отдать index.html для SPA-маршрутов
      sessionStorage.setItem(
        "spa-redirect",
        location.pathname + location.search + location.hash
      );
      location.replace("/index.html");
    </script>
  </head>
  <body></body>
</html>
